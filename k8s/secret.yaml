# Placeholder credentials. Change every value before a real deploy.
# Do not commit production keys. Prefer `kubectl create secret generic` or
# an external secret store, then point the Deployment at that Secret name.
apiVersion: v1
kind: Secret
metadata:
  name: auditlog-secrets
  labels:
    app.kubernetes.io/part-of: audit-log-service
type: Opaque
stringData:
  POSTGRES_USER: audit
  POSTGRES_PASSWORD: CHANGE_ME
  AUDIT_DB_USER: audit
  AUDIT_DB_PASSWORD: CHANGE_ME
  # High-entropy random string. Default repo key dev-local-key must not be used.
  # After least-privilege clients exist, rotate or disable the bootstrap row.
  AUDIT_BOOTSTRAP_API_KEY: CHANGE_ME
