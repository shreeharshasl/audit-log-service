apiVersion: v1
kind: Service
metadata:
  name: auditlog-service
  labels:
    app.kubernetes.io/name: audit-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: audit-log-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: audit-service
    app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auditlog-service
  labels:
    app.kubernetes.io/name: audit-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: audit-log-service
spec:
  # Multiple replicas share one database. Appends serialize on audit_chain_head;
  # replicas do not increase write throughput.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-service
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-service
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: auditlog-config
            - secretRef:
                name: auditlog-secrets
          command:
            - sh
            - -c
            - until pg_isready -h auditlog-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
      containers:
        - name: audit-service
          image: audit-log-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
          envFrom:
            - configMapRef:
                name: auditlog-config
            - secretRef:
                name: auditlog-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /audit-service/api/actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /audit-service/api/actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /audit-service/api/actuator/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
